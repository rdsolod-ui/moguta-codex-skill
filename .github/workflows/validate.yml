name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate skill package
        run: python3 tools/validate_skill.py skills/moguta-codex-skill

      - name: Run inspector tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile Python
        run: |
          python3 -m py_compile \
            skills/moguta-codex-skill/scripts/inspect_moguta.py \
            tools/validate_skill.py

      - name: Verify skills CLI discovery
        run: npx --yes skills@1.5.20 add . --list
